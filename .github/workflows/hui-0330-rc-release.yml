name: Hui 0.33.0 RC1 release
on:
  push:
    tags:
      - 'hui-v0.33.0-rc1'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify RC APK
        run: |
          test -s dist/Hui-v0.33.0-rc1.apk
          sha256sum dist/Hui-v0.33.0-rc1.apk
      - name: Publish RC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/Hui-v0.33.0-rc1.apk \
            --title '绘 0.33.0 · 完整功能 RC1' --prerelease \
            --notes-file hui-proxy/RELEASE_0.33.0_RC1.md
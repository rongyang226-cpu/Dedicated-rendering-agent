name: Hui 0.33.0 RC3 release
on:
  push:
    tags:
      - 'hui-v0.33.0-rc3'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify RC APK
        run: |
          test -s dist/Hui-v0.33.0-rc3.apk
          sha256sum dist/Hui-v0.33.0-rc3.apk
      - name: Publish RC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/Hui-v0.33.0-rc3.apk dist/Hui-v0.33.0-rc3.sha256 \
            --title '绘 0.33.0 · 可读性与网格布局 RC3' --prerelease \
            --notes-file hui-proxy/RELEASE_0.33.0_RC3.md

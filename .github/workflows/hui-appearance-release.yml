name: Publish Hui appearance preview

on:
  push:
    branches: [hui-proxy]
    paths:
      - 'dist/Hui-v3.2.0-appearance-preview.apk'
      - '.github/workflows/hui-appearance-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish signed appearance preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hui-v3.2.0-appearance-preview >/dev/null 2>&1 || gh release create hui-v3.2.0-appearance-preview --target "$GITHUB_SHA" --prerelease --title '绘 v3.2.0 外观预览（不能代理）' --notes '半身高清壁纸、高清头像与可自选本机背景；代理核心/VPN 尚未接入，不能代理上网。沿用旧莹宝包名，但签名不同，必须先卸载旧莹宝再安装；卸载将删除旧 App 本机数据。请先自行备份需要保存的内容。'
          gh release upload hui-v3.2.0-appearance-preview dist/Hui-v3.2.0-appearance-preview.apk --clobber

name: Hui FlClash Android
on:
  push:
    branches: [hui-flclash]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hui-proxy/flclash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: hui-proxy/flclash/core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: '3.47.1'
          cache: true
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android -v
      - name: List APKs
        run: find dist -maxdepth 1 -type f -name '*.apk' -print -exec sha256sum {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: Hui-FlClash-Android
          path: hui-proxy/flclash/dist/*.apk
          if-no-files-found: error
